# Hält das kostenlose Supabase-Projekt wach (Supabase pausiert nach 1 Woche ohne Nutzung).
# Läuft montags und donnerstags automatisch. Manuell: Reiter "Actions" → "Supabase wach halten" → "Run workflow".
name: Supabase wach halten

on:
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase kurz anfragen
        run: |
          curl --fail --silent --show-error -X POST \
            "https://ekfadoqamvnqpapkzlwz.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_GQjBj5kQ8iVqH7KIxdugMA_ED13yPAw" \
            -H "Content-Type: application/json" \
            -d '{}'
